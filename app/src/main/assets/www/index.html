<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K Music</title>
<script src="android-bridge.js"></script>
<script src="download.js"></script>
<style>
:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--glow:rgba(255,255,255,.35);--stage:#0a0a0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55);--card:rgba(0,0,0,.06);--line:rgba(0,0,0,.12);--glow:rgba(0,0,0,.25);--stage:#e9e9e9}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:'Outfit','Cairo',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.app{position:relative;width:100%;max-width:410px;height:100%;max-height:860px;background:var(--bg);overflow:hidden;border-radius:0}
@media(min-width:500px){.app{border-radius:38px;border:1px solid var(--line);box-shadow:0 0 80px -20px var(--glow)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ar{font-family:'Cairo',sans-serif;direction:rtl}
/* splash */
#splash{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s .2s,visibility 0s 1s}
#splash.off{opacity:0;visibility:hidden}
#splash svg.k{width:110px;height:110px;fill:var(--fg);stroke:none;filter:drop-shadow(0 0 22px var(--glow));animation:pop 1.4s cubic-bezier(.2,.8,.2,1) both}
#splash p{letter-spacing:.5em;font-weight:300;color:var(--dim);animation:pop 1.4s .4s both}
@keyframes pop{from{opacity:0;transform:scale(.7);filter:blur(10px)}}
/* screens */
.scr{position:absolute;inset:0;overflow-y:auto;padding:52px 20px 190px;display:none;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:block;animation:fade .45s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
h2{font-size:18px;font-weight:600;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:300;color:var(--dim);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center}
.ico{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.ico:active{transform:scale(.9);box-shadow:0 0 20px var(--glow)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -20px 0;padding:0 20px;scrollbar-width:none}
.chip{flex:none;padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;transition:.25s}
.chip.on{background:var(--fg);color:var(--bg);box-shadow:0 0 22px var(--glow)}
.hero{margin-top:20px;border-radius:28px;padding:22px;min-height:210px;position:relative;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 85% 15%,var(--glow),transparent 55%),var(--card);display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero .bigk{position:absolute;right:-18px;top:-14px;width:170px;height:170px;fill:var(--fg);stroke:none;opacity:.14;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(10px) rotate(4deg)}}
.hero b{font-size:24px;font-weight:600}.hero span{color:var(--dim);font-size:14px}
.btn{margin-top:10px;align-self:flex-start;display:flex;gap:8px;align-items:center;background:var(--fg);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:600;box-shadow:0 0 28px var(--glow);transition:.2s}
.btn:active{transform:scale(.94)}
.btn svg{width:18px;height:18px;fill:currentColor;stroke:none}
.row{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.al{flex:none;width:136px;text-align:left}
.art{aspect-ratio:1;border-radius:20px;border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:700;transition:.3s}
.al:active .art,.al:hover .art{transform:scale(.96);box-shadow:0 0 28px var(--glow)}
.al p{margin-top:8px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al small,.tr small{color:var(--dim);font-size:12px}
.tr{display:flex;align-items:center;gap:14px;padding:8px 0;width:100%;text-align:left;border-radius:14px;transition:.2s}
.tr:active{background:var(--card)}
.tr .art{width:52px;flex:none;border-radius:14px;font-size:18px}
.tr div.m{flex:1;min-width:0}.tr p{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.cur p{text-shadow:0 0 12px var(--fg)}
.srch{margin-top:18px;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.srch input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;min-width:0}
.mic{animation:ring 2.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--glow)}70%,100%{box-shadow:0 0 0 14px transparent}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gen{height:92px;border-radius:20px;padding:14px;display:flex;align-items:flex-end;font-weight:600;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden;transition:.25s}
.gen:active{transform:scale(.95);box-shadow:0 0 24px var(--glow)}
.gen::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:var(--glow);filter:blur(22px);opacity:.5}
.set{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}
.set span{display:flex;gap:14px;align-items:center}
.tg{width:48px;height:28px;border-radius:99px;background:var(--card);border:1px solid var(--line);position:relative;transition:.3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.3s}
.tg.on{background:var(--fg);box-shadow:0 0 18px var(--glow)}.tg.on::after{left:23px;background:var(--bg)}
.eq{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:8px}
.eq i{flex:1;background:var(--fg);border-radius:6px;opacity:.85;box-shadow:0 0 12px var(--glow);animation:eqa 1.6s ease-in-out infinite alternate}
@keyframes eqa{from{height:25%}to{height:95%}}
.prof{display:flex;gap:16px;align-items:center;margin-top:20px}
.av{width:74px;height:74px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:0 0 30px var(--glow)}
/* mini + nav */
#mini{position:absolute;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:22px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:12px;background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 0 30px -8px var(--glow);cursor:pointer;overflow:hidden}
#mini .art{width:46px;flex:none;border-radius:14px;font-size:16px}
#mini .m{flex:1;min-width:0}#mini p{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .pb{position:absolute;left:0;bottom:0;height:2px;background:var(--fg);box-shadow:0 0 8px var(--fg);width:0}
nav{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);padding:6px 14px;position:relative;transition:.3s}
nav button.on{color:var(--fg)}nav button.on svg{filter:drop-shadow(0 0 8px var(--fg))}
nav button.on::after{content:"";position:absolute;top:-11px;width:22px;height:3px;border-radius:3px;background:var(--fg);box-shadow:0 0 12px var(--fg)}
/* player */
#pl{position:absolute;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.85,.2,1);padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
#pl.open{transform:none}
#pl .bgk{position:absolute;inset:-20% -30% auto;height:70%;background:radial-gradient(circle,var(--glow),transparent 65%);opacity:.5;pointer-events:none;transition:opacity .6s}
#pl:not(.play) .bgk{opacity:.18}
#pl>*{position:relative}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.disc{width:min(74vw,290px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid var(--line);box-shadow:0 0 70px -10px var(--glow);animation:spin 14s linear infinite;animation-play-state:paused}
#pl.play .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.disc::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 18px transparent,inset 0 0 30px rgba(0,0,0,.4)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.disc svg{position:relative;z-index:2;width:64px;height:64px;fill:var(--fg);stroke:none;filter:drop-shadow(0 0 10px var(--glow))}
#lyr{display:none;flex:1;overflow-y:auto;text-align:center;padding:30px 0;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
#lyr p{font-size:24px;font-weight:600;margin:20px 0;color:var(--dim);transition:.4s;opacity:.4}
#lyr p.now{color:var(--fg);opacity:1;transform:scale(1.06);text-shadow:0 0 22px var(--glow)}
#pl.ly .stage{display:none}#pl.ly #lyr{display:block}
.viz{display:flex;align-items:center;justify-content:center;gap:4px;height:34px;margin-bottom:14px}
.viz i{width:4px;border-radius:4px;background:var(--fg);height:6px;box-shadow:0 0 8px var(--glow);animation:v 1s ease-in-out infinite alternate;animation-play-state:paused}
#pl.play .viz i{animation-play-state:running}
@keyframes v{to{height:34px}}
.info{display:flex;justify-content:space-between;align-items:center}
.info h3{font-size:24px;font-weight:600}.info small{color:var(--dim);font-size:15px}
.heart.on svg{fill:var(--fg);filter:drop-shadow(0 0 10px var(--fg));animation:beat .4s}
@keyframes beat{50%{transform:scale(1.4)}}
.bar{margin:20px 0 6px;height:5px;border-radius:5px;background:var(--line);position:relative;cursor:pointer}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--fg);box-shadow:0 0 14px var(--fg)}
.bar b::after{content:"";position:absolute;right:-7px;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--fg);box-shadow:0 0 14px var(--fg)}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.ctl .pp{width:74px;height:74px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 40px var(--glow);transition:.2s}
.ctl .pp:active{transform:scale(.9)}.pp svg{width:30px;height:30px;fill:currentColor;stroke:none}
.ctl button.on{color:var(--fg);filter:drop-shadow(0 0 8px var(--fg))}.ctl button{color:var(--dim)}.ctl .pp{color:var(--bg)}
.ctl button svg.f{fill:currentColor;stroke:none}
.foot{display:flex;justify-content:space-between;color:var(--dim);margin-top:6px}
.foot button.on{color:var(--fg)}
.toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-90px);z-index:60;background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;transition:.4s;box-shadow:0 0 30px var(--glow)}
.toast.on{transform:translate(-50%,0)}
.url{margin-top:16px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);transition:.3s}
.url:focus-within{box-shadow:0 0 28px var(--glow);border-color:var(--fg)}
.url input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px}
.sites{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.site{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.site i{font-style:normal;width:62px;height:62px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--fg);transition:.25s}
.site:active i{transform:scale(.9);box-shadow:0 0 26px var(--glow)}
.vc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;margin-bottom:10px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.25s}
.vc:active{transform:scale(.97);box-shadow:0 0 26px var(--glow)}
.vt{width:96px;height:64px;border-radius:14px;flex:none;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,var(--glow),transparent 70%),var(--bg);border:1px solid var(--line)}
.vt em{position:absolute;right:6px;bottom:4px;font-size:10px;font-style:normal;background:var(--bg);padding:1px 6px;border-radius:6px}
.vc .m{flex:1;min-width:0}.vc p{font-size:14px;font-weight:600}.vc small{color:var(--dim);font-size:12px}
.fab{position:sticky;bottom:175px;margin:0 auto;display:flex;width:fit-content;align-self:auto;animation:ring 2.4s infinite}
.fab svg,.dlb svg{fill:none;stroke:currentColor;stroke-width:2}
.empty{color:var(--dim);font-size:14px;padding:10px 0}
.tb{display:flex;gap:10px;align-items:center;margin-top:16px}.tb .btn{margin:0;flex:1;justify-content:center}
.sortb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}.sortb span{overflow:hidden;text-overflow:ellipsis}
.sumr{color:var(--dim);font-size:13px;margin:-6px 0 6px}
#shBg{position:absolute;inset:0;z-index:54;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.4s}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;padding:12px 22px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);border-radius:30px 30px 0 0;box-shadow:0 -10px 60px -20px var(--glow);transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.85,.2,1)}
.sh #shBg{opacity:1;pointer-events:auto}.sh #sheet{transform:none}
.grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 18px}
.shh{display:flex;gap:14px;align-items:center}.shh b{font-size:17px}.shh small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.seg{display:flex;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line);margin:18px 0 4px}
.seg button{flex:1;padding:10px;border-radius:99px;transition:.3s;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg);box-shadow:0 0 20px var(--glow)}
.shbar{height:4px;border-radius:4px;background:var(--line);margin:20px 0 14px;overflow:hidden}
.shbar b{display:block;height:100%;width:0;background:var(--fg);box-shadow:0 0 12px var(--fg)}
.note{display:block;text-align:center;color:var(--dim);font-size:12px;margin-top:12px}
#ob{position:absolute;inset:0;z-index:49;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px calc(40px + env(safe-area-inset-bottom,0px));gap:16px;transition:opacity .6s,visibility 0s .6s}
#ob.off{opacity:0;visibility:hidden}
#ob .orb{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:radial-gradient(circle,var(--glow),transparent 70%);box-shadow:0 0 80px -10px var(--glow);animation:float 5s ease-in-out infinite;margin-bottom:20px}
#ob .orb svg{width:68px;height:68px}#ob .orb svg.k{fill:var(--fg);stroke:none}
.dots{display:flex;gap:8px;margin-top:10px}.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:.4s}.dots i.on{width:26px;background:var(--fg);box-shadow:0 0 12px var(--fg)}
#sheet2{position:absolute;left:0;right:0;bottom:0;z-index:55;padding:12px 22px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);border-radius:30px 30px 0 0;box-shadow:0 -10px 60px -20px var(--glow);transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.85,.2,1)}
.sh2 #shBg{opacity:1;pointer-events:auto}.sh2 #sheet2{transform:none}
.bands{display:flex;justify-content:space-between;margin:20px 0;text-align:center}
.bands div{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
.bands input{writing-mode:vertical-lr;direction:rtl;height:130px;accent-color:var(--fg);filter:drop-shadow(0 0 6px var(--glow))}
.bands small{color:var(--dim);font-size:12px}
:root[data-theme="light"]{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55);--card:rgba(0,0,0,.06);--line:rgba(0,0,0,.12);--glow:rgba(0,0,0,.25);--stage:#e9e9e9}
.set .v{color:var(--dim);font-size:14px}
.hs{width:150px;accent-color:var(--fg);filter:drop-shadow(0 0 5px var(--glow))}
.set span:has(.hs){gap:10px}
#sheet2{max-height:90%;overflow-y:auto;scrollbar-width:none}
.bands input{height:110px!important}
.set:active{background:var(--card)}
/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
@keyframes sh{60%,100%{transform:translateX(120%)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes nb{from{transform:translateY(9px) scale(.7)}}
@keyframes hb{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@keyframes gl{50%{box-shadow:0 0 22px var(--glow)}}
.scr.on>*,.scr.on .row>*,.scr.on .grid>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
.scr.on .eq{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
#pl.open>*:not(.bgk){animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
nav button.on svg{animation:nb .55s cubic-bezier(.3,1.6,.5,1)}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:sh 3.5s ease-in-out infinite}
.hero::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,var(--glow),transparent 30%);opacity:.22;animation:spin 10s linear infinite;pointer-events:none}
.hero>*:not(.bigk){position:relative}
#mini{transform:translateY(180%);opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,.9,.2,1),opacity .4s}
#mini.show{transform:none;opacity:1;pointer-events:auto}
#pl.play~#mini .pb,.pb{animation:gl 1.6s ease-in-out infinite}
.btn:not(.fab),.chip,.tr,.vc,.cb,.ico,.ctl .pp{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
.heart{position:relative}
.hb{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--fg);box-shadow:0 0 8px var(--fg);animation:hb .7s ease-out forwards;pointer-events:none}
.tr.cur .art{animation:gl 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
/* ---- Android Auto style car mode ---- */
#car{--cbg:#050608;--cpn:rgba(255,255,255,.07);--cln:rgba(255,255,255,.13);--cdim:rgba(255,255,255,.62);--cfg:#fff;--cgl:rgba(255,255,255,.38);--cglo:radial-gradient(120% 90% at 72% -10%,rgba(255,255,255,.1),transparent 60%);
position:fixed;inset:0;z-index:300;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;grid-template-areas:"st st" "rl mn";background:var(--cglo),var(--cbg);color:var(--cfg);
padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
opacity:0;visibility:hidden;transform:scale(1.03);transition:opacity .35s,transform .5s cubic-bezier(.2,.85,.2,1),visibility 0s .5s;
font-family:'Outfit','Cairo',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}

.c-vol{display:flex;gap:8px;align-items:center}
.c-vol svg{width:20px;height:20px}

#cBat:empty{display:none}

.c-rail{grid-area:rl;display:flex;flex-direction:column;gap:8px;width:84px;padding:10px 8px;border-right:1px solid var(--cln)}
.c-rail i{flex:1}
.rb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border-radius:18px;color:var(--cdim);font-size:11px;font-weight:600;transition:.2s}
.rb svg{width:26px;height:26px}
.rb.on{background:var(--cfg);color:var(--cbg);box-shadow:0 0 26px -4px var(--cgl)}
.rb:active{transform:scale(.92)}
.rb.x{border:1px solid var(--cln)}

.c-mn{grid-area:mn;position:relative;min-width:0;min-height:0}
.cv{position:absolute;inset:0;display:none;min-height:0}

.cl{display:flex;flex-direction:column;justify-content:space-between;gap:clamp(6px,1.8vh,16px);min-width:0;min-height:0}
.cm{display:flex;align-items:center;gap:clamp(14px,2.6vw,28px);flex:1;min-height:0}
.cdisc{flex:none;width:clamp(100px,38vh,320px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid var(--cln);animation:spin 14s linear infinite paused;box-shadow:0 0 50px -12px var(--cgl);touch-action:pan-y}
#car.play .cdisc{animation-play-state:running}
.cdisc::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.cdisc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--cbg);border:1px solid var(--cln)}
.cdisc svg{position:relative;z-index:2;width:30%;height:30%;fill:var(--cfg);stroke:none}
.ci{flex:1;min-width:0}
.ci small{display:block;color:var(--cdim);letter-spacing:.18em;font-size:11px;font-weight:600}
.ct{font-size:clamp(22px,5.4vh,40px);font-weight:600;line-height:1.15;margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca{color:var(--cdim);font-size:clamp(15px,3.4vh,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvz{display:flex;gap:4px;align-items:flex-end;height:22px;margin-top:10px}
.cvz i{width:5px;height:20%;border-radius:3px;background:var(--cfg);box-shadow:0 0 8px var(--cgl);animation:cvz 1s ease-in-out infinite alternate paused}

@keyframes cring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 22px transparent}}
.cp{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--cdim);font-variant-numeric:tabular-nums}
.cbar{flex:1;height:8px;border-radius:8px;background:var(--cln);position:relative;touch-action:none;cursor:pointer}
.cbar::before{content:"";position:absolute;inset:-18px 0}
.cbar b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:var(--cfg);box-shadow:0 0 12px var(--cgl)}
.cbar b::after{content:"";position:absolute;right:-9px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--cfg);box-shadow:0 0 14px var(--cfg)}
.cr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cb{flex:none;width:clamp(52px,15vh,84px);height:clamp(52px,15vh,84px);border-radius:50%;display:grid;place-items:center;background:var(--cpn);border:1px solid var(--cln);color:var(--cfg);transition:.2s}

.cb.sm svg{width:50%;height:50%}

.cb.pp{width:clamp(70px,22vh,112px);height:clamp(70px,22vh,112px);background:var(--cfg);color:var(--cbg);border-color:transparent;box-shadow:0 0 50px -6px var(--cgl)}
.cb.pp svg{width:40%;height:40%;stroke:none}

.qr,.lr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:16px;min-height:64px;transition:.2s}

.qr .m,.lr .m{flex:1;min-width:0}
.qr p,.lr p{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr small,.lr small{color:var(--cdim);font-size:13px}
.lr{min-height:76px;border:1px solid var(--cln);background:var(--cpn)}
.lr.cur{background:var(--cfg);color:var(--cbg)}
.lr.cur small{color:inherit;opacity:.65}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;overflow-y:auto;padding:4px 2px 16px;scrollbar-width:none;align-content:start}
.c-tabs{display:flex;gap:10px;margin-bottom:12px}
.ctab{padding:12px 24px;border-radius:99px;border:1px solid var(--cln);background:var(--cpn);font-size:16px;font-weight:600;color:var(--cdim);transition:.25s}

.c-empty{color:var(--cdim);padding:20px 8px;font-size:15px}
.c-toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-30px);opacity:0;background:var(--cfg);color:var(--cbg);padding:10px 22px;border-radius:99px;font-weight:600;font-size:15px;transition:.35s;pointer-events:none;z-index:5;white-space:nowrap}
.c-toast.on{transform:translate(-50%,0);opacity:1}

.c-vc{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;opacity:0;visibility:hidden;transition:.3s;color:#fff;padding:20px}
